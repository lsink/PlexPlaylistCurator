version: '3.8'

services:
  plex-playlist-creator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plex-playlist-creator
    restart: unless-stopped
    ports:
      - "32500:32500"
    volumes:
      - ./data:/data
    environment:
      - PORT=32500
      - DATA_DIR=/data
      # Optional: signs login cookies. If unset, a random per-install secret is generated in the data volume.
      # - SESSION_SECRET=<long-random-string>
      # Optional: set to the number of reverse proxies in front of the app (e.g. 1) so login rate limiting
      # sees real client IPs and cookies are marked Secure over HTTPS.
      # - TRUST_PROXY=1
